[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "MCP service exposing the Go Pet Hospital REST API to AI agents"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pet_hospital_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
