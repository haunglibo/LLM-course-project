[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anythingllm-mcp"
version = "0.1.0"
description = "MCP server bridging local AnythingLLM to AI agents"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]

[project.scripts]
anythingllm-mcp = "server:main"
